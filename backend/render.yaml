services:
  - type: web
    name: nutrisync-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutrisync-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://frontend-azure-omega-45f4cqwbni.vercel.app", "https://frontend-5ikh3sr0t-tharungowdaprs-projects.vercel.app", "https://frontend-bbudpim24-tharungowdaprs-projects.vercel.app"]'
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: text
      - key: GROQ_API_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://nutrisync-backend.onrender.com

databases:
  - name: nutrisync-db
    plan: free
    databaseName: nutrisync
    user: nutrisync
