# AaharAI NutriSync — Docker Compose
# Usage: docker-compose up --build
# Docs:  https://docs.docker.com/compose/

# version: "3.8" is obsolete, removed to avoid confusion

networks:
  nutrisync-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: nutrisync-backend
    networks:
      - nutrisync-net
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - LOG_FORMAT=json
      - APP_ENV=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist ChromaDB + Excel knowledge base
      - ./backend/app/db/static:/app/app/db/static
      # Persist SQLite database outside the container
      - nutrisync_db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: nutrisync-frontend
    networks:
      - nutrisync-net
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  nutrisync_db:
    driver: local
